[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "qoi"
description = "A simple, fast wrapper around qoi (https://qoiformat.org), the 'Quite OK Image' format"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kodonnell", email = "kodonnell@users.noreply.github.com" }]
keywords = ["qoi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.11"
dependencies = ["numpy>=1.23.2"]
# Version comes from Cargo.toml.
dynamic = ["version"]

[project.optional-dependencies]
dev = ["maturin>=1.7,<2", "pytest", "pillow", "opencv-python-headless"]

[project.urls]
Homepage = "https://github.com/kodonnell/qoi"
"Bug Tracker" = "https://github.com/kodonnell/qoi/issues"

[tool.maturin]
python-source = "src"
module-name = "qoi._qoi"
features = ["pyo3/extension-module"]
